name: Build desktop release

# 三平台安装包发布。
#
# 触发：
#   1. 推 v* tag —— 覆盖 `git tag && git push` 的路径；
#   2. 发布 Release —— 覆盖在 GitHub 页面点「Publish release」的路径。
#      两者都需要：对一个**已存在**的 tag 在页面上补发 Release 时不会产生 push 事件，
#      只发 Release 才会触发。release 事件的 GITHUB_REF 就是该 tag，resolve-version
#      解析逻辑无需改动；重复触发是幂等的（publish-release 用 --clobber 覆盖）。
#   3. 手动触发，保留兜底。
#
# 每个平台都在自己架构的 runner 上原生构建 —— 不交叉编译，因为 better-sqlite3
# 和 sherpa-onnx 的平台二进制是按 runner 的 os/arch 由包管理器挑选安装的。
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (for example v1.0.2); defaults to package.json"
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner 标签必须精确钉住架构，不能用别名：跑错架构时依赖安装会装上
          # 另一架构的原生模块，构建不报错，只会静默产出启动即崩的包。
          # macos-15 = Apple Silicon（macos-latest 自 2025-08 起也指向它，但别名会漂移）。
          - name: macOS Apple silicon
            os: macos-15
            platform: mac
            arch: arm64
            artifact: ling-macos-arm64
            files: |
              release/*.dmg
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            artifact: ling-windows-x64
            files: |
              release/*.exe
              release/*.exe.blockmap
          # ubuntu-latest / ubuntu-24.04 都是 x64。ARM64 的 runner 标签是 ubuntu-24.04-arm，
          # 这里刻意不用 —— 只出 x64 的 Linux 包。
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            linux_targets: deb AppImage
            artifact: ling-linux-x64
            files: |
              release/*.deb
              release/*.AppImage
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 必须在 setup-node 之前：cache: pnpm 要求 pnpm 已在 PATH 上。
      # 版本由 package.json 的 packageManager 字段决定，不在这里写死。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "${{ needs.resolve-version.outputs.version }}" ]; then
            echo "package.json version ($package_version) does not match release version (${{ needs.resolve-version.outputs.version }})"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 未签名发布：CI 里没有 Apple 证书，走 ad-hoc 签名（identity: "-"）。
      # Apple 芯片要求 arm64 可执行文件至少有 ad-hoc 签名才能启动，而 electron-builder
      # 重命名 bundle / 改 Info.plist 会破坏 Electron 自带的签名，所以必须重签。
      # ad-hoc 不等于 Developer ID 签名，Gatekeeper 仍会拦截，需要用户手动放行。
      # 默认 entitlements 模板已含 com.apple.security.cs.disable-library-validation，
      # 这是 ad-hoc + hardenedRuntime 组合避免 library validation 启动失败的先决条件。
      #
      # 放在命令行而非 package.json，是为了不覆盖维护者本机可能存在的真实证书：
      # 本地 dist:mac 仍走自动发现，能签就签真名。
      - name: Build macOS installer
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac dmg --arm64 --config.mac.identity=- --publish never
      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux ${{ matrix.linux_targets }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* --title "Ling $TAG" --generate-notes
          fi
