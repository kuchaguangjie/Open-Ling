name: Bug 报告
description: 报告可复现的软件问题（安全漏洞请勿在此公开提交）
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "请勿上传真实会谈、数据库、API Key、录音或其他可识别个人的信息。安全和隐私问题请按 SECURITY.md 私密报告。"
  - type: input
    id: version
    attributes:
      label: Ling 版本
      placeholder: 例如 1.0.10
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux / 其他开发环境
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明期望结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请使用合成示例，不要包含真实会谈内容。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 提交前请再次确认已移除密钥、姓名和会谈内容。
