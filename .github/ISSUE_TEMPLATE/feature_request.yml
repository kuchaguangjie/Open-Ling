name: 功能建议
description: 提议 Ling 框架、桌面端或扩展机制的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: 需求与使用场景
      description: 请说明使用者遇到的问题，不要提交真实个案或会谈。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 数据、安全和兼容性影响
      description: 如涉及 Prompt、Memory、咨询师包、外部服务或本地数据，请说明。
