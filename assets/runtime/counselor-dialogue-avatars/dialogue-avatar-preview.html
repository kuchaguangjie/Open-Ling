<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>咨询师聊天头像裁切选取</title>
    <style>
      :root { color: #382f25; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 16% 10%, rgba(255, 250, 236, .72), transparent 26%), linear-gradient(135deg, #f7f0e6 0%, #e7d8c5 48%, #d9e1d0 100%); }
      main { display: grid; gap: 20px; margin: 0 auto; max-width: 1080px; min-height: 100vh; padding: 28px; }
      header { align-items: end; display: flex; gap: 18px; justify-content: space-between; }
      h1 { font-size: 22px; line-height: 1.25; margin: 0; }
      p { color: #7a6650; font-size: 14px; line-height: 1.6; margin: 7px 0 0; }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
      .variant-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
      .variant-tabs:empty { display: none; }
      button { appearance: none; background: rgba(255,252,246,.76); border: 1px solid rgba(117,95,67,.2); border-radius: 999px; color: #5a4530; cursor: pointer; font: inherit; font-size: 14px; min-height: 36px; padding: 0 14px; }
      button.active { background: #756043; border-color: #756043; color: #fff8ed; }
      button:focus-visible, input:focus-visible { outline: 3px solid rgba(86,124,118,.5); outline-offset: 2px; }
      .workspace { display: grid; gap: 20px; grid-template-columns: minmax(360px,1fr) minmax(300px,.82fr); }
      .panel { background: rgba(255,252,246,.76); border: 1px solid rgba(117,95,67,.16); border-radius: 12px; box-shadow: 0 18px 40px rgba(87,68,45,.12); padding: 20px; }
      .panel h2 { font-size: 16px; margin: 0; }
      .crop-stage { aspect-ratio: 1; background: linear-gradient(45deg,rgba(135,116,88,.08) 25%,transparent 25%), linear-gradient(-45deg,rgba(135,116,88,.08) 25%,transparent 25%), linear-gradient(45deg,transparent 75%,rgba(135,116,88,.08) 75%), linear-gradient(-45deg,transparent 75%,rgba(135,116,88,.08) 75%); background-position: 0 0,0 8px,8px -8px,-8px 0; background-size: 16px 16px; border-radius: 50%; cursor: grab; margin: 18px auto; max-width: 430px; overflow: hidden; position: relative; touch-action: none; user-select: none; width: min(100%,430px); }
      .crop-stage::after { border: 2px solid rgba(255,250,239,.92); border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(86,69,48,.25),0 0 0 1px rgba(86,69,48,.17); content: ""; inset: 0; pointer-events: none; position: absolute; }
      .crop-stage.dragging { cursor: grabbing; }
      .crop-image,.avatar-image { height: 100%; left: 0; object-fit: contain; pointer-events: none; position: absolute; top: 0; transform-origin: center; width: 100%; }
      .control-row { display: grid; gap: 9px; }
      .control-label { align-items: center; color: #604c35; display: flex; font-size: 14px; justify-content: space-between; }
      input[type="range"] { accent-color: #756043; width: 100%; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .hint { font-size: 13px; margin-top: 13px; }
      .preview-column { align-content: start; display: grid; gap: 14px; }
      .avatar-row { align-items: center; display: grid; gap: 13px; grid-template-columns: 68px 1fr; }
      .avatar-window { background: rgba(255,250,241,.9); border: 1px solid rgba(128,112,92,.14); border-radius: 50%; box-shadow: 0 8px 18px rgba(105,86,62,.1); overflow: hidden; position: relative; }
      .size-34 { height: 34px; width: 34px; } .size-44 { height: 44px; width: 44px; } .size-64 { height: 64px; width: 64px; }
      .avatar-copy strong { display: block; font-size: 14px; } .avatar-copy span { color: #7a6650; font-size: 13px; }
      .chat-demo { background: rgba(247,240,230,.8); border: 1px solid rgba(117,95,67,.12); border-radius: 10px; display: grid; gap: 13px; margin-top: 8px; padding: 16px; }
      .message { align-items: start; display: grid; gap: 10px; grid-template-columns: 34px minmax(0,1fr); }
      .bubble { background: rgba(255,250,242,.92); border: 1px solid rgba(128,112,92,.12); border-radius: 13px; color: #4d3c2b; font-size: 13px; line-height: 1.65; padding: 10px 12px; }
      .message-name { color: #8d765d; display: block; font-size: 12px; margin-bottom: 5px; }
      .selection-code { color: #806342; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 12px; margin-top: 2px; word-break: break-all; }
      @media (max-width:760px) { header,.workspace { display:grid; grid-template-columns:1fr; } header { align-items:start; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>咨询师聊天头像裁切选取</h1><p>在圆框内拖动角色，调节缩放；右侧实时显示 App 的 34px 聊天头像。</p></div>
        <div class="tabs" aria-label="咨询师切换"><button class="active" type="button" data-counselor="chengling">程灵</button><button type="button" data-counselor="zhouzhou">周舟</button><button type="button" data-counselor="linleshui">林乐水</button></div>
      </header>
      <div id="variant-tabs" class="variant-tabs" aria-label="程灵头像候选"></div>
      <section class="workspace">
        <section class="panel" aria-label="头像裁切选区">
          <h2 id="editor-title">程灵的圆形选区</h2>
          <div id="crop-stage" class="crop-stage" aria-label="拖动调整头像取景区域"><img id="crop-image" class="crop-image" draggable="false" alt="当前头像裁切选区" /></div>
          <div class="control-row"><label class="control-label" for="zoom"><span>缩放</span><output id="zoom-value" for="zoom">100%</output></label><input id="zoom" type="range" min="1" max="2.4" step="0.01" value="1" /></div>
          <div class="actions"><button id="reset" type="button">重置选区</button><button id="copy-selection" type="button">复制选区参数</button></div>
          <p class="hint">将脸部置于圆心略偏上位置通常最适合 34px 聊天气泡。选定后，把“选区参数”发给我即可。</p>
        </section>
        <aside class="panel preview-column" aria-label="头像效果预览">
          <h2>实时预览</h2>
          <div class="avatar-row"><div class="avatar-window size-64"><img class="avatar-image" data-avatar-preview alt="64 像素头像" /></div><div class="avatar-copy"><strong>64px</strong><span>列表或详情页</span></div></div>
          <div class="avatar-row"><div class="avatar-window size-44"><img class="avatar-image" data-avatar-preview alt="44 像素头像" /></div><div class="avatar-copy"><strong>44px</strong><span>较大圆形头像</span></div></div>
          <div class="avatar-row"><div class="avatar-window size-34"><img class="avatar-image" data-avatar-preview alt="34 像素头像" /></div><div class="avatar-copy"><strong>34px</strong><span>当前 App 消息头像尺寸</span></div></div>
          <div class="chat-demo"><div class="message"><div class="avatar-window size-34"><img class="avatar-image" data-avatar-preview alt="聊天框中的咨询师头像" /></div><div><span id="chat-name" class="message-name">程灵</span><div class="bubble">我在这里。你可以慢慢说，我们先从现在最明显的感受开始。</div></div></div></div>
          <div id="selection-code" class="selection-code" aria-live="polite"></div>
        </aside>
      </section>
    </main>
    <script>
      const counselors = {
        chengling: { name: "程灵", variants: [{ label: "主线原版 · 保持不变", avatar: "chengling/chengling-dialogue-avatar-pixel-v8-user-frame-transparent.png" }] },
        zhouzhou: { name: "周舟", variants: [{ label: "新头像 · 已按选区裁切", avatar: "zhouzhou/user-selected/zhouzhou-dialogue-avatar-q-style-v1-cropped-transparent.png" }] },
        linleshui: { name: "林乐水", variants: [{ label: "新头像 · 已按选区裁切", avatar: "linleshui/user-selected/linleshui-dialogue-avatar-q-style-v3-cropped-transparent.png" }] }
      };
      const defaults = { chengling: { x: 0, y: 2, zoom: 1.18 }, zhouzhou: { x: 0, y: 0, zoom: 1 }, linleshui: { x: 0, y: 0, zoom: 1 } };
      const state = Object.fromEntries(Object.entries(defaults).map(([id,value]) => [id,{...value}]));
      let activeId = "chengling"; let activeVariant = 0; let dragStart = null;
      const stage = document.querySelector("#crop-stage"), cropImage = document.querySelector("#crop-image"), previews = document.querySelectorAll("[data-avatar-preview]"), zoom = document.querySelector("#zoom"), zoomValue = document.querySelector("#zoom-value"), code = document.querySelector("#selection-code"), title = document.querySelector("#editor-title"), chatName = document.querySelector("#chat-name"), buttons = document.querySelectorAll("[data-counselor]"), variantTabs = document.querySelector("#variant-tabs");
      const transformFor = (current) => `translate(${current.x}%, ${current.y}%) scale(${current.zoom})`;
      function render() { const counselor = counselors[activeId], current = state[activeId], variant = counselor.variants[activeVariant], transform = transformFor(current); cropImage.src = variant.avatar; cropImage.style.transform = transform; previews.forEach((image) => { image.src = variant.avatar; image.style.transform = transform; }); zoom.value = current.zoom; zoomValue.value = `${Math.round(current.zoom * 100)}%`; title.textContent = `${counselor.name}的圆形选区`; chatName.textContent = counselor.name; code.textContent = `${activeId} · ${variant.label}: x ${current.x.toFixed(1)}%, y ${current.y.toFixed(1)}%, scale ${current.zoom.toFixed(2)}`; buttons.forEach((button) => button.classList.toggle("active", button.dataset.counselor === activeId)); variantTabs.innerHTML = counselor.variants.length > 1 ? counselor.variants.map((item, index) => `<button class="${index === activeVariant ? "active" : ""}" type="button" data-variant="${index}">${item.label}</button>`).join("") : ""; variantTabs.querySelectorAll("[data-variant]").forEach((button) => button.addEventListener("click", () => { activeVariant = Number(button.dataset.variant); render(); })); }
      zoom.addEventListener("input", () => { state[activeId].zoom = Number(zoom.value); render(); });
      document.querySelector("#reset").addEventListener("click", () => { state[activeId] = {...defaults[activeId]}; render(); });
      document.querySelector("#copy-selection").addEventListener("click", async () => { const text = code.textContent; try { await navigator.clipboard.writeText(text); code.textContent = `${text}（已复制）`; } catch { code.textContent = `${text}（请手动复制）`; } });
      buttons.forEach((button) => button.addEventListener("click", () => { activeId = button.dataset.counselor; activeVariant = 0; render(); }));
      stage.addEventListener("pointerdown", (event) => { dragStart = { pointerId:event.pointerId, x:event.clientX, y:event.clientY, originX:state[activeId].x, originY:state[activeId].y }; stage.setPointerCapture(event.pointerId); stage.classList.add("dragging"); });
      stage.addEventListener("pointermove", (event) => { if (!dragStart || dragStart.pointerId !== event.pointerId) return; const rect = stage.getBoundingClientRect(); state[activeId].x = dragStart.originX + ((event.clientX-dragStart.x)/rect.width)*100; state[activeId].y = dragStart.originY + ((event.clientY-dragStart.y)/rect.height)*100; render(); });
      const stopDragging = (event) => { if (!dragStart || dragStart.pointerId !== event.pointerId) return; dragStart = null; stage.classList.remove("dragging"); };
      stage.addEventListener("pointerup", stopDragging); stage.addEventListener("pointercancel", stopDragging); render();
    </script>
  </body>
</html>
